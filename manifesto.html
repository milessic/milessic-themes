<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manifesto · milessic-themes</title>
  <link rel="stylesheet" data-milessic-theme href="/css/bundle/system.css">
  <script src="/js/themes.js"></script>
  <style>
    /* Tokens only (manifesto §1.3), so the overlay wears whichever theme is active. */
    body { overflow: hidden; }
    .overlay {
      position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
      background: color-mix(in srgb, var(--page) 55%, transparent);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .overlay > .card {
      width: 100%; max-width: 860px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); margin: 0;
      display: flex; flex-direction: column; padding-bottom: 0;
    }
    /* Padding-top and box-shadow stay with the theme: overlays draw title bars and bevels with them. */
    .overlay .section-head { margin: 0; padding-bottom: .75rem; border-bottom: 1px solid var(--line); align-items: center; }
    .overlay .section-head h2 { margin: 0; }
    .prose { overflow-y: auto; overscroll-behavior: contain; padding: 1.25rem .25rem 2rem; line-height: 1.6; overflow-wrap: anywhere; }
    .prose img { max-width: 100%; height: auto; }
    .prose > :first-child { margin-top: 0; }
    .prose h1 { font-size: 1.6rem; }
    .prose h2 { font-size: 1.2rem; margin: 2rem 0 .75rem; }
    .prose h3 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
    .prose p, .prose ul, .prose ol { margin: 0 0 .9rem; }
    .prose li { margin-bottom: .3rem; }
    .prose hr { border: 0; border-top: 1px solid var(--line); margin: 1.75rem 0; }
    .prose blockquote { margin: 0 0 .9rem; padding: .1rem 1rem; border-left: 3px solid var(--accent); color: var(--ink-2); }
    .prose pre {
      background: var(--surface-2); border: 1px solid var(--line); border-radius: calc(var(--radius) / 2);
      padding: .8rem 1rem; overflow-x: auto; line-height: 1.45; margin: 0 0 1rem;
    }
    .prose pre code { font-size: .85em; }
    .prose :not(pre) > code { background: var(--surface-2); border-radius: 4px; padding: .05em .3em; }
    .prose .scroll-x { margin: 0 0 1rem; }
    .prose .toc ul { list-style: none; padding-left: 1rem; }
    .prose .toc > ul { padding-left: 0; }
    /* Phones: the dialog fills the screen instead of floating in a padded frame. */
    @media (max-width: 640px) {
      .overlay { padding: 0; place-items: stretch; }
      .overlay > .card {
        max-width: none; height: 100vh; height: 100dvh; max-height: none;
        border-radius: 0; padding-left: 1rem; padding-right: 1rem;
      }
      .overlay .section-head { flex-wrap: nowrap; }
      .prose { padding: 1rem 0 calc(1.5rem + env(safe-area-inset-bottom)); line-height: 1.55; }
      .prose h1 { font-size: 1.35rem; }
      .prose h2 { font-size: 1.1rem; margin-top: 1.5rem; }
      .prose ul, .prose ol { padding-left: 1.25rem; }
      .prose .toc ul { padding-left: .75rem; }
      .prose pre { padding: .6rem .75rem; }
      .prose pre code { font-size: .8em; }
      .prose pre, .prose pre code { overflow-wrap: normal; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">milessic-themes</a>
  <nav class="nav">
    <a href="/">Gallery</a>
    <a href="/manifesto" class="active">Manifesto</a>
    <a href="/api/themes">API</a>
  </nav>
</header>

<div class="overlay" id="overlay">
  <section class="card" role="dialog" aria-modal="true" aria-labelledby="manifesto-title">
    <div class="section-head">
      <h2 id="manifesto-title">Manifesto</h2>
      <div class="toolbar">
        <a class="btn small" href="/manifesto.md">Raw</a>
        <a class="btn small ghost" href="/" id="close" aria-label="Close">Close</a>
      </div>
    </div>
    <article class="prose">
{{content}}
    </article>
  </section>
</div>

<script>
  // /manifesto?theme=bevel opens in a given theme, same as the gallery.
  var requested = new URLSearchParams(location.search).get("theme");
  if (requested) MilessicThemes.apply(requested);
  function close() { location.href = document.getElementById("close").href; }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  document.getElementById("overlay").addEventListener("click", function (e) { if (e.target === this) close(); });
</script>
</body>
</html>
